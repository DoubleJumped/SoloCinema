name: collect

on:
  # The 15-minute cadence (9:07am-11:52pm Regina time) is driven by Supabase
  # pg_cron calling workflow_dispatch; see
  # supabase/migrations/0006_dispatch_collector_from_pg_cron.sql. GitHub's own
  # scheduler dropped ~90% of runs at that frequency. This sparse schedule is
  # only a backstop in case the dispatcher stops (e.g. an expired token).
  schedule:
    - cron: "41 16,19,22,1,4 * * *"
  workflow_dispatch:

# A delayed run can pile onto the next slot's run; queue them instead of
# collecting concurrently.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      outcome: ${{ steps.run.outcome }}
      failed_chains: ${{ steps.run.outputs.failed_chains }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # Deliberately not ".[collector]": without Playwright installed the
      # Landmark source uses its Atom Tickets HTTP path, same as it did on
      # Render (see research/collector-efficiency-audit.md).
      - run: pip install -e .
      # A failure here doesn't fail the workflow yet; the retry job below
      # gets one more go at whichever chains failed.
      - id: run
        continue-on-error: true
        run: python -m collector.solocinema_collector.cli run-all --database-url supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CINEPLEX_SUBSCRIPTION_KEY: ${{ secrets.CINEPLEX_SUBSCRIPTION_KEY }}

  # The 2026-10-03 and 2026-10-04 Cineplex 403s outlasted more than 90 seconds
  # of in-run retries, yet the next run 15 minutes later was fine, so waiting
  # longer on the same runner isn't the answer. Collect the failed chains once
  # more from a fresh runner (new IP, a few minutes later); the workflow only
  # goes red if that fails too.
  retry:
    needs: collect
    if: needs.collect.outputs.outcome == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # FAILED_CHAINS is empty if the first attempt died before reporting,
      # which collects every chain again.
      - run: |
          echo "::warning::First attempt failed (${FAILED_CHAINS:-all chains}); collecting again."
          python -m collector.solocinema_collector.cli run-all --database-url supabase --chains "$FAILED_CHAINS"
        env:
          FAILED_CHAINS: ${{ needs.collect.outputs.failed_chains }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CINEPLEX_SUBSCRIPTION_KEY: ${{ secrets.CINEPLEX_SUBSCRIPTION_KEY }}
