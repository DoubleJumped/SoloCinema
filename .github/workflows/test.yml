name: test

# main takes direct pushes, so this is the only check a collector change gets
# before the next scheduled collection runs it against the live sites.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # No Playwright, matching the collect job.
      - run: pip install -e . pytest
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
